services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://asli:asli@db:5432/asli
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asli
      POSTGRES_PASSWORD: asli
      POSTGRES_DB: asli
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asli"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
